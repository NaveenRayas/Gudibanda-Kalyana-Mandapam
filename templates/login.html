
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Gudibanda Kalyana Mandapam</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .login-section {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: #fffdf9;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .login-card h1 {
            text-align: center;
            font-family: Georgia, serif;
            margin-bottom: 10px;
            color: #252525;
        }

        .login-card p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #b88935;
        }

        .login-button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 25px;
    background: #b88935;
    color: white;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 5px 15px rgba(184, 137, 53, 0.20);
}

.login-button:hover {
    background: #a57425;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(184, 137, 53, 0.30);
}

.login-button:active {
    transform: translateY(0);
}

        .register-link {
            text-align: center;
            margin-top: 25px;
        }

        .register-link a {
            color: #b88935;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
        .nav-links {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-links a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 20px;
    transition: all 0.3s ease;
}

.nav-links a:hover {
    background: #f4ead7;
    color: #9a6b20;
}

/* Current Login button */
.nav-links a[href="/login"] {
    background: #b88935;
    color: white;
}

.nav-links a[href="/login"]:hover {
    background: #a57425;
    color: white;
}

/* Register button */
.nav-links a[href="/register"] {
    border: 1px solid #b88935;
    color: #9a6b20;
}

.nav-links a[href="/register"]:hover {
    background: #b88935;
    color: white;
}
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            Gudibanda Kalyana Mandapam
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/availability">Availability</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="login-section">

        <div class="login-card">

            <h1>Welcome Back</h1>

            <p>Login to manage your booking</p>

            <form action="/login" method="POST">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit" class="login-button">
                    LOGIN
                </button>

            </form>


            <div class="register-link">

                Don't have an account?
                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 Gudibanda Kalyana Mandapam.
            All Rights Reserved.
        </p>

    </footer>

</body>
</html>
```
